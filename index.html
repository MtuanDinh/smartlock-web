<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng Quan - Smart Lock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .btn-custom { transition: all 0.2s ease-in-out; }
        .btn-custom:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3) !important; }
        .status-circle { width: 130px; height: 130px; display: inline-flex; justify-content: center; align-items: center; border-radius: 50%; transition: all 0.3s; }
        .status-icon { font-size: 4.5rem; transition: all 0.3s; }
        
        /* CSS CHO THANH ĐIỀU HƯỚNG DƯỚI ĐÁY (MOBILE APP STYLE) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: #212529; border-top: 1px solid #343a40;
            display: flex; justify-content: space-around;
            padding: 10px 0 8px; /* Đã xóa hàm calc() gây lỗi khoảng trống */
            z-index: 1050;
        }
        .bottom-nav-item {
            color: #6c757d; text-decoration: none; display: flex;
            flex-direction: column; align-items: center;
            font-size: 0.75rem; font-weight: 600; transition: color 0.2s;
        }
        .bottom-nav-item i { font-size: 1.4rem; margin-bottom: 2px; }
        .bottom-nav-item.active { color: #0d6efd; }
        
        /* Tùy biến hiển thị theo thiết bị */
        @media (min-width: 992px) { .bottom-nav { display: none !important; } }
        @media (max-width: 991px) { body { padding-bottom: 65px; } }
    </style>
</head>
<body class="bg-body">

<div id="authLoadingScreen" class="container mt-5 text-center">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <h5 class="text-primary mt-3 fw-bold">Đang kết nối hệ thống...</h5>
</div>

<div id="loginScreen" class="container mt-5" style="max-width: 400px; display: none;">
    <div class="card shadow-lg border-0 mt-5 bg-dark-subtle rounded-4">
        <div class="card-body p-4 p-md-5 text-center">
            <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
            <h3 class="text-white fw-bold mb-4 mt-2">ĐĂNG NHẬP</h3>
            <input type="email" id="loginEmail" class="form-control mb-3 py-2 bg-dark text-white border-secondary" placeholder="Email quản trị">
            <input type="password" id="loginPass" class="form-control mb-4 py-2 bg-dark text-white border-secondary" placeholder="Mật khẩu bảo mật">
            <button id="btnLogin" class="btn btn-primary w-100 fw-bold py-2 rounded-pill btn-custom">Vào Hệ Thống</button>
            <p id="loginError" class="text-danger mt-3 mb-0" style="display: none;"></p>
        </div>
    </div>
</div>

<div id="dashboardScreen" style="display: none;">
    <!-- THANH MENU TRÊN CÙNG (DÙNG CHUNG) -->
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary sticky-top shadow-sm mb-4">
        <div class="container-fluid" style="max-width: 1000px;">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
                <i class="bi bi-cpu-fill"></i> SMART LOCK
            </a>
            
            <!-- Menu PC -->
            <div class="d-none d-lg-flex me-auto ms-4 gap-2">
                <a class="nav-link active fw-bold text-white bg-secondary bg-opacity-25 rounded px-3 py-2" href="index.html"><i class="bi bi-house-door-fill me-1"></i> Tổng quan</a>
                <a class="nav-link px-3 py-2 text-light" href="users.html"><i class="bi bi-people me-1"></i> Thành viên</a>
                <a class="nav-link px-3 py-2 text-light" href="logs.html"><i class="bi bi-clock-history me-1"></i> Nhật ký</a>
            </div>

            <!-- Nút trạng thái và đăng xuất -->
            <div class="d-flex align-items-center gap-2">
                <span id="sysStatusBadge" class="badge bg-secondary p-2 shadow-sm"><i class="bi bi-hourglass-split"></i></span>
                <button id="btnLogout" class="btn btn-outline-light btn-sm fw-bold rounded-pill px-3 py-1" title="Đăng xuất"><i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Thoát</span></button>
            </div>
        </div>
    </nav>

    <!-- NỘI DUNG CHÍNH -->
    <div class="container mb-4" style="max-width: 1000px;">
        <div class="row g-4">
            <!-- CỘT TRÁI: ĐIỀU KHIỂN & TRẠNG THÁI -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 mb-4 bg-dark-subtle h-100">
                    <div class="card-body text-center py-5 d-flex flex-column justify-content-center">
                        <div id="bigLockCircle" class="status-circle bg-primary bg-opacity-10 mb-4 shadow-sm mx-auto">
                            <i id="bigLockIcon" class="bi bi-lock-fill text-primary status-icon"></i>
                        </div>
                        <h3 id="bigLockText" class="fw-bold text-white mb-2">CỬA ĐANG ĐÓNG</h3>
                        <p id="bigLockSubtext" class="text-muted small mb-4">Hệ thống an ninh đang hoạt động bình thường.</p>
                        
                        <div class="px-md-3">
                            <button id="btnOpenDoor" class="btn btn-success btn-lg w-100 rounded-pill shadow-sm mb-3 py-3 fw-bold fs-5 btn-custom disabled">
                                <i class="bi bi-unlock me-2"></i> MỞ KHÓA TỪ XA
                            </button>
                            <div class="row g-2">
                                <div class="col-6">
                                    <button id="btnRestart" class="btn btn-dark btn-lg w-100 rounded-pill shadow-sm py-2 border border-secondary btn-custom fw-bold fs-6 disabled">
                                        <i class="bi bi-arrow-clockwise me-1"></i> Khởi Động
                                    </button>
                                </div>
                                <div class="col-6">
                                    <button id="btnLockdown" class="btn btn-danger btn-lg w-100 rounded-pill shadow-sm py-2 fw-bold btn-custom fs-6 disabled">
                                        <i class="bi bi-shield-lock me-1"></i> KHÓA CHẶT
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CỘT PHẢI: LỊCH SỬ GẦN ĐÂY -->
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-4 h-100 bg-dark-subtle">
                    <div class="card-header bg-dark border-bottom border-secondary fw-bold d-flex justify-content-between align-items-center py-3 rounded-top-4">
                        <span class="text-info"><i class="bi bi-activity me-2"></i>Hoạt động mới nhất</span>
                        <a href="logs.html" class="btn btn-sm btn-outline-info rounded-pill px-3">Xem hết</a>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0 align-middle text-center small">
                            <tbody id="logsTableBody">
                                <tr><td colspan="3" class="text-muted py-5">Đang tải lịch sử...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- THANH ĐIỀU HƯỚNG DƯỚI ĐÁY (CHỈ HIỆN TRÊN MOBILE APP) -->
    <div class="bottom-nav d-lg-none">
        <a href="index.html" class="bottom-nav-item active">
            <i class="bi bi-house-door-fill"></i>
            <span>Tổng quan</span>
        </a>
        <a href="users.html" class="bottom-nav-item">
            <i class="bi bi-people"></i>
            <span>Thành viên</span>
        </a>
        <a href="logs.html" class="bottom-nav-item">
            <i class="bi bi-clock-history"></i>
            <span>Nhật ký</span>
        </a>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
    // BẠN HÃY ĐIỀN LẠI THÔNG TIN API FIREBASE VÀO ĐÂY NHÉ
    const firebaseConfig = {
        apiKey: "AIzaSyB7w3c38FM845cYwsnz_xXVDlRnlcdIz8U", 
        authDomain: "lock-iot-2a021.firebaseapp.com",
        projectId: "lock-iot-2a021",
        databaseURL: "https://lock-iot-2a021-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginError = document.getElementById('loginError');
    let isDataLoaded = false;
    let isSystemLockdown = false;
    let isOffline = true;

    document.getElementById('btnLogin').addEventListener('click', () => {
        auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value, document.getElementById('loginPass').value).catch(() => {
            loginError.innerText = "Sai tài khoản hoặc mật khẩu!"; loginError.style.display = "block";
        });
    });

    document.getElementById('btnLogout').addEventListener('click', () => auth.signOut());

    auth.onAuthStateChanged((user) => {
        document.getElementById('authLoadingScreen').style.display = "none";
        if (user) {
            loginScreen.style.display = "none"; dashboardScreen.style.display = "block";
            if (!isDataLoaded) { startLoadingDashboardData(); isDataLoaded = true; }
        } else {
            loginScreen.style.display = "block"; dashboardScreen.style.display = "none";
        }
    });

    function updateBigLockUI() {
        let circle = document.getElementById('bigLockCircle'), icon = document.getElementById('bigLockIcon');
        let title = document.getElementById('bigLockText'), subtext = document.getElementById('bigLockSubtext');

        if (isOffline) {
            circle.className = "status-circle bg-secondary bg-opacity-25 mb-4 shadow-sm mx-auto";
            icon.className = "bi bi-wifi-off text-secondary status-icon";
            title.innerText = "MẤT KẾT NỐI"; title.className = "fw-bold text-secondary mb-2";
            subtext.innerText = "Ổ khóa ngoại tuyến. Các nút điều khiển tạm khóa.";
        } else if (isSystemLockdown) {
            circle.className = "status-circle bg-danger bg-opacity-25 mb-4 shadow-lg mx-auto";
            icon.className = "bi bi-shield-lock-fill text-danger status-icon";
            title.innerText = "ĐANG KHÓA CHẶT"; title.className = "fw-bold text-danger mb-2";
            subtext.innerText = "Hệ thống an ninh cảnh giác cao. Vô hiệu hóa phím cứng.";
        } else {
            circle.className = "status-circle bg-primary bg-opacity-25 mb-4 shadow-sm mx-auto";
            icon.className = "bi bi-lock-fill text-primary status-icon";
            title.innerText = "CỬA ĐANG ĐÓNG"; title.className = "fw-bold text-white mb-2";
            subtext.innerText = "Hệ thống an ninh đang hoạt động bình thường.";
        }
    }

    function startLoadingDashboardData() {
        database.ref('SmartLock/Control/Lockdown').on('value', (snapshot) => {
            isSystemLockdown = snapshot.val() || false;
            let btn = document.getElementById('btnLockdown');
            if (isSystemLockdown) {
                btn.classList.replace('btn-danger', 'btn-outline-danger');
                btn.innerHTML = `<i class="bi bi-shield-check me-1"></i> Mở Trở Lại`;
            } else {
                btn.classList.replace('btn-outline-danger', 'btn-danger');
                btn.innerHTML = `<i class="bi bi-shield-lock me-1"></i> KHÓA CHẶT`;
            }
            updateBigLockUI();
        });

        // BẢN VÁ LỖI: HIỂN THỊ ĐỦ 5 DÒNG NHẬT KÝ
        database.ref('SmartLock/Logs').orderByChild('timestamp').limitToLast(5).on('value', (snapshot) => {
            let logs = [];
            
            // Dùng ngoặc nhọn để ngăn việc return giá trị chiều dài mảng (nguyên nhân gây dừng sớm vòng lặp)
            snapshot.forEach((child) => {
                logs.push(child.val());
            });
            
            logs.reverse(); 
            
            let html = '';
            logs.forEach(log => {
                let actionStr = log.action || 'Không rõ'; let userStr = log.user || 'Không rõ';
                let timeObj = log.timestamp ? new Date(log.timestamp) : null;
                let timeStr = timeObj ? `${timeObj.getHours().toString().padStart(2,'0')}:${timeObj.getMinutes().toString().padStart(2,'0')} <span class="text-secondary" style="font-size:0.75rem">${timeObj.getDate()}/${timeObj.getMonth()+1}</span>` : '--:--';
                
                let badgeClass = 'text-success'; let iconClass = 'bi-check-circle-fill';
                if (actionStr.includes('Cảnh báo')) { badgeClass = 'text-danger'; iconClass = 'bi-exclamation-octagon-fill'; }
                else if (actionStr.includes('Nút bấm')) { badgeClass = 'text-secondary'; iconClass = 'bi-record-circle'; }
                else if (actionStr.includes('Web')) { badgeClass = 'text-primary'; iconClass = 'bi-globe2'; }
                else if (actionStr.includes('HỆ THỐNG')) { badgeClass = 'text-info'; iconClass = 'bi-cpu-fill'; }

                html += `<tr>
                            <td class="text-light text-nowrap py-3">${timeStr}</td>
                            <td class="text-nowrap ${badgeClass} py-3"><i class="bi ${iconClass} me-1"></i> ${actionStr}</td>
                            <td class="fw-bold text-light text-nowrap py-3">${userStr}</td>
                         </tr>`;
            });
            if (html === '') html = '<tr><td colspan="3" class="text-muted py-5">Chưa có hoạt động nào.</td></tr>';
            document.getElementById('logsTableBody').innerHTML = html;
        });

        let lastBeatTime = 0; let serverTimeOffset = 0; 
        database.ref('.info/serverTimeOffset').on('value', snap => serverTimeOffset = snap.val() || 0);
        database.ref('SmartLock/System/Last_Beat').on('value', snap => { lastBeatTime = snap.val(); checkSystemStatus(); });

        function checkSystemStatus() {
            if (lastBeatTime === 0) return; 
            let diff = (Date.now() + serverTimeOffset) - lastBeatTime;
            let badge = document.getElementById('sysStatusBadge');
            let btns = [document.getElementById('btnOpenDoor'), document.getElementById('btnLockdown'), document.getElementById('btnRestart')];
            if (diff < 20000) { 
                isOffline = false; 
                badge.className = "badge bg-success bg-opacity-25 text-success border border-success p-2 shadow-sm"; 
                badge.innerHTML = "<i class='bi bi-wifi'></i> <span class='d-none d-sm-inline'>Online</span>"; 
                btns.forEach(btn => btn.classList.remove('disabled'));
            } else {
                isOffline = true; 
                badge.className = "badge bg-danger bg-opacity-25 text-danger border border-danger p-2 shadow-sm"; 
                badge.innerHTML = "<i class='bi bi-wifi-off'></i> <span class='d-none d-sm-inline'>Offline</span>"; 
                btns.forEach(btn => btn.classList.add('disabled'));
            }
            updateBigLockUI();
        }
        setInterval(checkSystemStatus, 3000);
    }

    document.getElementById('btnLockdown').addEventListener('click', () => {
        if (!isSystemLockdown) {
            if (confirm("CẢNH BÁO: Chế độ Khóa Khẩn Cấp sẽ vô hiệu hóa phím và thẻ. Chắc chắn?")) database.ref('SmartLock/Control/Lockdown').set(true);
        } else { database.ref('SmartLock/Control/Lockdown').set(false); }
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
        if (confirm("Khởi động lại mạch cứng. Sẽ gián đoạn 10 giây. Chắc chắn?")) {
            database.ref('SmartLock/Control/Restart').set(true);
            let btn = document.getElementById('btnRestart');
            btn.innerHTML = `<i class="bi bi-hourglass-split me-1"></i> Đang chờ...`;
            setTimeout(() => btn.innerHTML = `<i class="bi bi-arrow-clockwise me-1"></i> Khởi Động`, 3000);
        }
    });

    document.getElementById('btnOpenDoor').addEventListener('click', () => {
        database.ref('SmartLock/Control/Remote_Open').set(true);
        let btn = document.getElementById('btnOpenDoor');
        let circle = document.getElementById('bigLockCircle'), icon = document.getElementById('bigLockIcon'), title = document.getElementById('bigLockText');
        
        btn.innerHTML = `<i class="bi bi-send-check me-2"></i> ĐÃ GỬI LỆNH MỞ`;
        circle.className = "status-circle bg-success bg-opacity-25 mb-4 shadow-lg mx-auto";
        icon.className = "bi bi-unlock-fill text-success status-icon";
        title.innerText = "CỬA ĐANG MỞ"; title.className = "fw-bold text-success mb-2";

        setTimeout(() => { btn.innerHTML = `<i class="bi bi-unlock me-2"></i> MỞ KHÓA TỪ XA`; updateBigLockUI(); }, 3000);
    });
</script>
</body>
</html>
