<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Sử Hoạt Động - Smart Lock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Tùy chỉnh thanh cuộn cho bảng trên Mobile */
        .table-responsive::-webkit-scrollbar { height: 6px; }
        .table-responsive::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
    </style>
</head>
<body class="bg-light">

<!-- ======================================================= -->
<!-- MÀN HÌNH CHỜ XÁC THỰC -->
<!-- ======================================================= -->
<div id="authLoadingScreen" class="container mt-5 text-center">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <h5 class="text-primary mt-3 fw-bold">Đang kết nối hệ thống...</h5>
</div>

<!-- ======================================================= -->
<!-- MÀN HÌNH ĐĂNG NHẬP -->
<!-- ======================================================= -->
<div id="loginScreen" class="container mt-5" style="max-width: 400px; display: none;">
    <div class="card shadow border-0">
        <div class="card-body p-4 text-center">
            <h3 class="text-primary fw-bold mb-4">🔐 ĐĂNG NHẬP</h3>
            <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Email quản trị">
            <input type="password" id="loginPass" class="form-control mb-3" placeholder="Mật khẩu bảo mật">
            <button id="btnLogin" class="btn btn-primary w-100 fw-bold">Vào Hệ Thống</button>
            <p id="loginError" class="text-danger mt-3 mb-0" style="display: none;"></p>
        </div>
    </div>
</div>

<!-- ======================================================= -->
<!-- KHU VỰC DASHBOARD CHÍNH -->
<!-- ======================================================= -->
<div id="dashboardScreen" style="display: none;">
    <div class="container mt-3 mt-md-4 mb-5" style="max-width: 1000px;">
        
        <!-- Nút quay lại và Tiêu đề (Tự động dàn cột trên Mobile) -->
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mb-4 gap-3">
            <h3 class="text-primary fw-bold mb-0 text-center text-sm-start">LỊCH SỬ HOẠT ĐỘNG</h3>
            <div class="d-flex w-100 w-sm-auto gap-2">
                <a href="index.html" class="btn btn-outline-secondary fw-bold shadow-sm flex-fill">🔙 Bảng điều khiển</a>
                <button id="btnLogout" class="btn btn-outline-danger fw-bold shadow-sm flex-fill">Đăng xuất</button>
            </div>
        </div>

        <!-- Bảng lưu trữ toàn bộ sự kiện -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-bold d-flex flex-column flex-md-row justify-content-between align-items-center py-3 gap-2">
                <span>🗄️ Toàn bộ dữ liệu truy cập khóa</span>
                <!-- Thanh tìm kiếm Real-time (Tràn viền trên Mobile) -->
                <div class="w-100" style="max-width: 400px;">
                    <input type="text" id="searchInput" class="form-control form-control-sm w-100" placeholder="🔍 Tìm kiếm (VD: Mở cửa, Bố, Mẹ)...">
                </div>
            </div>
            
            <div class="card-body p-0 table-responsive" style="min-height: 500px;">
                <table class="table table-hover table-striped mb-0 align-middle text-center">
                    <thead class="table-secondary shadow-sm text-nowrap">
                        <tr>
                            <th style="width: 10%">STT</th>
                            <th style="width: 25%">Giờ</th>
                            <th style="width: 30%">Sự kiện</th>
                            <th style="width: 35%">Thành viên</th>
                        </tr>
                    </thead>
                    <tbody id="fullLogsTableBody">
                        <tr><td colspan="4" class="text-muted py-5 fs-5">⏳ Đang tải dữ liệu...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Khu vực Phân trang (Pagination) - Tự động giãn dòng trên Mobile -->
            <div class="card-footer bg-white d-flex flex-column flex-md-row justify-content-between align-items-center py-3 border-top gap-3">
                <span id="pageInfo" class="text-muted small fw-bold text-center">Hiển thị 0 bản ghi</span>
                <nav class="overflow-auto w-100 w-md-auto d-flex justify-content-center">
                    <ul class="pagination pagination-sm mb-0" id="paginationControls">
                        <!-- Các nút phân trang sẽ được tạo tự động bằng JS -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
    // CẤU HÌNH FIREBASE (HÃY ĐIỀN API KEY CỦA BẠN VÀO ĐÂY)
    const firebaseConfig = {
        apiKey: "AIzaSyB7w3c38FM845cYwsnz_xXVDlRnlcdIz8U", 
        authDomain: "lock-iot-2a021.firebaseapp.com",
        projectId: "lock-iot-2a021",
        databaseURL: "https://lock-iot-2a021-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const auth = firebase.auth();

    // ==========================================
    // QUẢN LÝ XÁC THỰC (AUTHENTICATION)
    // ==========================================
    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginError = document.getElementById('loginError');
    let isDataLoaded = false;

    document.getElementById('btnLogin').addEventListener('click', () => {
        let email = document.getElementById('loginEmail').value;
        let pass = document.getElementById('loginPass').value;
        auth.signInWithEmailAndPassword(email, pass).catch((error) => {
            loginError.innerText = "❌ Sai tài khoản hoặc mật khẩu!";
            loginError.style.display = "block";
        });
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
        auth.signOut();
    });

    auth.onAuthStateChanged((user) => {
        // Tắt màn hình loading ngay khi Firebase kiểm tra xong
        document.getElementById('authLoadingScreen').style.display = "none";

        if (user) {
            // Mở Dashboard
            loginScreen.style.display = "none";
            dashboardScreen.style.display = "block";
            
            if (!isDataLoaded) {
                if(typeof startLoadingLogsData === 'function') startLoadingLogsData();
                isDataLoaded = true;
            }
        } else {
            // Trả về màn hình đăng nhập nếu chưa có quyền
            loginScreen.style.display = "block";
            dashboardScreen.style.display = "none";
        }
    });

    // ==========================================
    // KHỞI CHẠY DỮ LIỆU SAU KHI ĐĂNG NHẬP
    // ==========================================
    let allLogs = [];            
    let currentDisplayLogs = []; 
    let currentPage = 1;
    const logsPerPage = 20; 

    function startLoadingLogsData() {
        database.ref('SmartLock/Logs').on('value', (snapshot) => {
            allLogs = [];
            snapshot.forEach((child) => {
                let logData = child.val();
                if (logData && typeof logData === 'object') allLogs.push(logData);
            });
            
            allLogs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            currentDisplayLogs = [...allLogs];
            currentPage = 1; 
            renderCurrentPage();
        });
    }

    function renderCurrentPage() {
        let totalLogs = currentDisplayLogs.length;
        let totalPages = Math.ceil(totalLogs / logsPerPage) || 1;
        
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        let startIndex = (currentPage - 1) * logsPerPage;
        let endIndex = startIndex + logsPerPage;
        let logsToRender = currentDisplayLogs.slice(startIndex, endIndex);

        let html = '';
        let lastDateStr = '';
        let index = startIndex + 1; 
        
        logsToRender.forEach(log => {
            let actionStr = log.action || 'Không rõ sự kiện';
            let userStr = log.user || 'Không rõ';
            
            let dateObj = log.timestamp ? new Date(log.timestamp) : null;
            let dateStr = dateObj ? dateObj.toLocaleDateString('vi-VN') : 'Không rõ ngày';
            let timeStr = dateObj ? dateObj.toLocaleTimeString('vi-VN', { hour12: false }) : '--:--:--';

            if (dateStr !== lastDateStr) {
                html += `
                    <tr class="table-info border-bottom border-2 border-info">
                        <td colspan="4" class="text-start fw-bold fs-6 text-dark py-2 ps-4 shadow-sm">
                            📅 ${dateStr}
                        </td>
                    </tr>
                `;
                lastDateStr = dateStr; 
            }

            let badgeClass = 'bg-success'; 
            if (actionStr.includes('Cảnh báo')) badgeClass = 'bg-danger';
            else if (actionStr.includes('Nút bấm')) badgeClass = 'bg-secondary';
            else if (actionStr.includes('Web')) badgeClass = 'bg-primary';
            else if (actionStr.includes('HỆ THỐNG')) badgeClass = 'bg-dark';
            else if (actionStr.includes('khởi động')) badgeClass = 'bg-info text-dark';

            html += `<tr>
                        <td class="fw-bold text-muted">${index++}</td>
                        <td class="text-muted fw-semibold text-nowrap">${timeStr}</td>
                        <td class="text-nowrap"><span class="badge ${badgeClass}">${actionStr}</span></td>
                        <td class="fw-bold text-nowrap">${userStr}</td>
                     </tr>`;
        });
        
        if (html === '') html = '<tr><td colspan="4" class="text-muted py-5">Không tìm thấy bản ghi nào.</td></tr>';
        document.getElementById('fullLogsTableBody').innerHTML = html;

        let endRecord = Math.min(endIndex, totalLogs);
        let startRecord = totalLogs === 0 ? 0 : startIndex + 1;
        document.getElementById('pageInfo').innerText = `Hiển thị ${startRecord} - ${endRecord} / Tổng ${totalLogs} bản ghi`;

        renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
        let paginationHtml = '';
        
        if (totalPages <= 1) {
            document.getElementById('paginationControls').innerHTML = '';
            return;
        }

        let prevDisabled = (currentPage === 1) ? 'disabled' : '';
        paginationHtml += `<li class="page-item ${prevDisabled}"><a class="page-link" href="#" onclick="changePage(${currentPage - 1})">«</a></li>`;
        
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                let activeClass = (i === currentPage) ? 'active' : '';
                paginationHtml += `<li class="page-item ${activeClass}"><a class="page-link" href="#" onclick="changePage(${i})">${i}</a></li>`;
            } else if (i === currentPage - 2 || i === currentPage + 2) {
                paginationHtml += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }
        }

        let nextDisabled = (currentPage === totalPages) ? 'disabled' : '';
        paginationHtml += `<li class="page-item ${nextDisabled}"><a class="page-link" href="#" onclick="changePage(${currentPage + 1})">»</a></li>`;
        
        document.getElementById('paginationControls').innerHTML = paginationHtml;
    }

    window.changePage = function(page) {
        currentPage = page;
        renderCurrentPage();
    };

    document.getElementById('searchInput').addEventListener('keyup', function() {
        let keyword = this.value.toLowerCase().trim();
        
        currentDisplayLogs = allLogs.filter(log => {
            let actionMatch = (log.action || '').toLowerCase().includes(keyword);
            let userMatch = (log.user || '').toLowerCase().includes(keyword);
            let timeMatch = (log.timestamp ? new Date(log.timestamp).toLocaleDateString('vi-VN') : '').toLowerCase().includes(keyword);
            return actionMatch || userMatch || timeMatch;
        });
        
        currentPage = 1; 
        renderCurrentPage();
    });
</script>

</body>
</html>
