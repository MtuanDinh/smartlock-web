name: Deploy Smart Lock Web to GitHub Pages

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter & typecheck
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Verify required VITE_FIREBASE_* variables are non-empty
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyB7w3c38FM845cYwsnz_xXVDlRnlcdIz8U' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'lock-iot-2a021.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'lock-iot-2a021' }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL || 'https://lock-iot-2a021-default-rtdb.asia-southeast1.firebasedatabase.app' }}
        run: |
          missing=0
          for var_name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_DATABASE_URL; do
            val="${!var_name}"
            if [ -z "$val" ]; then
              echo "::error::Missing required Firebase variable: $var_name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Build failed: One or more VITE_FIREBASE_* variables are empty."
            exit 1
          fi

      - name: Build production bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyB7w3c38FM845cYwsnz_xXVDlRnlcdIz8U' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'lock-iot-2a021.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'lock-iot-2a021' }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL || 'https://lock-iot-2a021-default-rtdb.asia-southeast1.firebasedatabase.app' }}
          VITE_ONLINE_THRESHOLD_MS: ${{ vars.VITE_ONLINE_THRESHOLD_MS || '35000' }}
          VITE_BIOMETRIC_SERVER_URL: ${{ vars.VITE_BIOMETRIC_SERVER_URL || '' }}
          VITE_USE_MOCK: 'false'
        run: npm run build

      - name: Verify mock data is not bundled in production dist
        run: |
          if grep -rn "admin@smartlock.local" dist/; then
            echo "::error::Mock data (admin@smartlock.local) was found in production dist/!"
            exit 1
          fi
          echo "Verified: No mock data leaked into dist/."

      - name: Deploy to gh-pages branch (Dual support for 'Deploy from a branch')
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          force_orphan: true

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
